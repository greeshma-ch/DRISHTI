name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      EMERGENCY_DRY_RUN: "true"
      EMERGENCY_HMAC_SECRET: "ci-test-secret"
      TELEGRAM_BOT_TOKEN: "ci-telegram-token"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - run: ruff check server
      - run: python -m pytest server/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test -- --run
      - run: npm --prefix apps/web run build
